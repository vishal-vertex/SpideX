<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpideX Sign In</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #000000, #660000);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .signin-card {
      width: 90%;
      max-width: 360px;
      aspect-ratio: 3 / 4; /* Updated aspect ratio */
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      padding: 35px 30px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .signin-card h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
      color: #ff0000;
    }

    .signin-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .signin-card input::placeholder {
      color: #ccc;
    }

    .signin-card button {
      width: 100%;
      padding: 14px;
      background-color: #ff0000;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .signin-card button:hover {
      background-color: #cc0000;
    }

    .signin-card p {
      text-align: center;
      margin-top: 15px;
      color: #ffcccc;
    }

    .signin-card a {
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
    }

    .signin-card a:hover {
      text-decoration: underline;
    }

    #error {
      color: #ff6666;
      text-align: center;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    @media (max-width: 480px) {
      .signin-card {
        aspect-ratio: auto;
        padding: 25px 20px;
      }

      .signin-card h1 {
        font-size: 1.6rem;
      }

      .signin-card button {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <div class="signin-card" id="signinScreen">
    <h1>Student Login</h1>
    <input type="number" id="roll" placeholder="Enter Roll Number" />
    <input type="date" id="dob" placeholder="Enter Date of Birth" />
    <button onclick="signIn()">Sign In</button>
    <p>Not a member in SpideX? <a href='/signup'>Sign Up</a></p>
    <div id="error"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

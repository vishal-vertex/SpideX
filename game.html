<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #000000, #660000);
      color: white;
    }
    h1 {
      margin-bottom: 10px;
      color: #ff4d4d;
    }
    #game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(255, 0, 0, 0.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      max-width: 90vmin;
      max-height: 90vmin;
      width: 90vmin;
      height: 90vmin;
    }
    .tile {
      width: 100%;
      height: 100%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(10px + 2vmin);
      border-radius: 8px;
      font-weight: bold;
      color: #fff;
    }
    .tile[data-value="0"] { background: rgba(255, 255, 255, 0.05); color: transparent; }
    .tile[data-value="2"] { background: #eee4da; color: #776e65; }
    .tile[data-value="4"] { background: #ede0c8; color: #776e65; }
    .tile[data-value="8"] { background: #f2b179; color: #f9f6f2; }
    .tile[data-value="16"] { background: #f59563; }
    .tile[data-value="32"] { background: #f67c5f; }
    .tile[data-value="64"] { background: #f65e3b; }
    .tile[data-value="128"] { background: #edcf72; }
    .tile[data-value="256"] { background: #edcc61; }
    .tile[data-value="512"] { background: #edc850; }
    .tile[data-value="1024"] { background: #edc53f; }
    .tile[data-value="2048"] { background: #edc22e; }
    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <h1>2048</h1>
  <div id="game-board"></div>
  <script>
    const boardSize = 4;
    const board = [];
    const boardEl = document.getElementById('game-board');

    function createBoard() {
      boardEl.innerHTML = '';
      for (let i = 0; i < boardSize; i++) {
        board[i] = [];
        for (let j = 0; j < boardSize; j++) {
          board[i][j] = 0;
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.dataset.value = 0;
          boardEl.appendChild(tile);
        }
      }
      addRandomTile();
      addRandomTile();
      updateBoard();
    }

    function addRandomTile() {
      let emptyTiles = [];
      for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
          if (board[i][j] === 0) emptyTiles.push([i, j]);
        }
      }
      if (emptyTiles.length === 0) return;
      const [x, y] = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
      board[x][y] = Math.random() < 0.9 ? 2 : 4;
    }

    function updateBoard() {
      const tiles = boardEl.children;
      for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
          const index = i * boardSize + j;
          tiles[index].textContent = board[i][j] || '';
          tiles[index].dataset.value = board[i][j];
        }
      }
    }

    function rotateClockwise(mat) {
      const res = Array.from({ length: boardSize }, () => []);
      for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
          res[j][boardSize - i - 1] = mat[i][j];
        }
      }
      return res;
    }

    function slideLeft(row) {
      const newRow = row.filter(x => x);
      while (newRow.length < boardSize) newRow.push(0);
      for (let i = 0; i < boardSize - 1; i++) {
        if (newRow[i] && newRow[i] === newRow[i + 1]) {
          newRow[i] *= 2;
          newRow[i + 1] = 0;
        }
      }
      const finalRow = newRow.filter(x => x);
      while (finalRow.length < boardSize) finalRow.push(0);
      return finalRow;
    }

    function move(direction) {
      let rotated = board;
      for (let i = 0; i < direction; i++) rotated = rotateClockwise(rotated);
      rotated = rotated.map(slideLeft);
      for (let i = 0; i < (4 - direction) % 4; i++) rotated = rotateClockwise(rotated);
      board.forEach((row, i) => board[i] = rotated[i]);
      addRandomTile();
      updateBoard();
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') move(0);
      if (e.key === 'ArrowRight') move(1);
      if (e.key === 'ArrowDown') move(2);
      if (e.key === 'ArrowLeft') move(3);
    });

    // Touch swipe detection
    let startX, startY;
    window.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    window.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) move(1); // Right
        else if (dx < -30) move(3); // Left
      } else {
        if (dy > 30) move(2); // Down
        else if (dy < -30) move(0); // Up
      }
    });

    createBoard();
  </script>
</body>
</html>
